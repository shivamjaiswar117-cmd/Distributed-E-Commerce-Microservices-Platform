name: CI + Docker + ECR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service/user-service
          - product-service/product-service
          - order-service/order-service
          - payment-service/payment-service
          - inventory-service/inventory-service
          - notification-service/notification-service
          - api-gateway/api-gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: ./mvnw clean test

  docker-and-ecr:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::051133077781:role/github-actions-ecr-role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push user-service
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/user-service:latest ./user-service/user-service
          docker push ${{ steps.login-ecr.outputs.registry }}/user-service:latest

      - name: Build and push product-service
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/product-service:latest ./product-service/product-service
          docker push ${{ steps.login-ecr.outputs.registry }}/product-service:latest

      - name: Build and push order-service
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/order-service:latest ./order-service/order-service
          docker push ${{ steps.login-ecr.outputs.registry }}/order-service:latest

      - name: Build and push payment-service
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/payment-service:latest ./payment-service/payment-service
          docker push ${{ steps.login-ecr.outputs.registry }}/payment-service:latest

      - name: Build and push inventory-service
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/inventory-service:latest ./inventory-service/inventory-service
          docker push ${{ steps.login-ecr.outputs.registry }}/inventory-service:latest

      - name: Build and push notification-service
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/notification-service:latest ./notification-service/notification-service
          docker push ${{ steps.login-ecr.outputs.registry }}/notification-service:latest

      - name: Build and push api-gateway
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/api-gateway:latest ./api-gateway/api-gateway
          docker push ${{ steps.login-ecr.outputs.registry }}/api-gateway:latest

  oidc-debug:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="$PAYLOAD$(printf '%*s' $PAD '' | tr ' ' '=')"
          echo "$PAYLOAD" | base64 -d | jq '{iss, sub, aud, repository, repository_owner, ref}'
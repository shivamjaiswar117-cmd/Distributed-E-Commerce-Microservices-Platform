
name: Java CI and Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service/user-service
          - product-service/product-service
          - order-service/order-service
          - payment-service/payment-service
          - inventory-service/inventory-service
          - notification-service/notification-service
          - api-gateway/api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

  docker-build:
    name: Build and scan Docker image - ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build-and-test

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service/user-service
            image: user-service
          - service: product-service/product-service
            image: product-service
          - service: order-service/order-service
            image: order-service
          - service: payment-service/payment-service
            image: payment-service
          - service: inventory-service/inventory-service
            image: inventory-service
          - service: notification-service/notification-service
            image: notification-service
          - service: api-gateway/api-gateway
            image: api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: local/${{ matrix.image }}:latest

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.image }}:latest
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
